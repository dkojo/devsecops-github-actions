name: DevSecOps pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  pipeline:
    name: Scan, gate and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write    # OIDC sign-in to AWS for Amazon Inspector (no stored AWS keys)
      packages: write    # push the approved image to GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # SonarQube uses full history to tell new code from old

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Unit tests
        run: |
          pip install -r app/requirements-dev.txt
          pytest app --cov=app --cov-report=xml:coverage.xml

      # 1. The three scanners. Each one reports; none of them blocks on its own.
      #    The policy gate further down reads all three results and makes one decision.

      - name: SonarQube scan
        id: sonar
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true

      - name: Set up Snyk
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0

      - name: Snyk dependency scan
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: >
          snyk test --file=app/requirements.txt --package-manager=pip --command=python
          --json-file-output=snyk.json

      - name: Docker build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true      # keep the image on the runner so Inspector scans it before any push
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Sign in to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true

      - name: Amazon Inspector image scan
        id: inspector
        uses: aws-actions/vulnerability-scan-github-action-for-amazon-inspector@6b57bbc6000f30afb3cfc2d00b9c442ddc4f1fc9 # v1.7.0
        with:
          artifact_type: container
          artifact_path: ${{ env.IMAGE }}:${{ github.sha }}
          critical_threshold: 1
          high_threshold: 1
          threshold_fixable_only: true
          display_vulnerability_findings: enabled

      # 2. One decision for all three scanners

      - name: Policy gate
        env:
          SONAR_OUTCOME: ${{ steps.sonar.outcome }}
          INSPECTOR_EXCEEDED: ${{ steps.inspector.outputs.vulnerability_threshold_exceeded }}
        run: python scripts/policy_gate.py

      # 3. Deploy: only from main, and only if the gate passed (a failed gate stops the job above)

      - name: Sign in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy approved image to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
          echo "Deployed $IMAGE:$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
